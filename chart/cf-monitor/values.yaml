replicaCount: 1

image:
  repository: 331944361160.dkr.ecr.us-east-2.amazonaws.com/cf-monitor
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
readinessProbe:
  httpGet:
    path: /health
    port: 8080

volumes:
  - name: health-config
    configMap:
      name: cf-monitor
      items:
        - key: healthcheckconfig.json
          path: healthcheckconfig.json


volumeMounts:
  - name: health-config
    mountPath: /app/healthcheckconfig.json
    subPath: healthcheckconfig.json


nodeSelector: {}

tolerations: []

affinity: {}
